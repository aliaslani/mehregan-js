<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>User Finder</h1>
            <p>Search Users using async javascript</p>

        </header>
        <div class="search-section">
            <input type="text" name="user" id="searchInput" placeholder="Search users by name ...">
            <button id="searchBtn">Search</button>
            <button id="loadBtn">Load Users</button>
        </div>

        <div class="status-section">
            <p id="statusMessage">
                Click "Load Users" to get started.
            </p>

        </div>

        <div class="userContainer">
            
        </div>
    </div>


    <script src="main.js"></script>
</body>
</html>
